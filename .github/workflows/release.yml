name: Release installer

# Builds the Windows .exe (and macOS .dmg + Linux .AppImage) installers
# on every git tag matching v*.*.* and attaches them to a GitHub Release.
#
# This is the canonical way to produce the Windows installer — building
# a real signed .exe from macOS via Wine is flaky and we'd rather lean on
# a clean Windows runner. To cut a release:
#   git tag v0.2.0 && git push --tags

on:
  push:
    tags:
      - "v*.*.*"
  # Manual trigger from the Actions tab — useful for dry-running the
  # build without cutting an actual tag/release.
  workflow_dispatch:

permissions:
  contents: write   # so the publish step can create / attach to a release

jobs:
  build:
    strategy:
      # When one platform fails, keep building the others. CI failures on
      # a single OS shouldn't block shipping installers for the remaining
      # platforms — the user can publish a partial release while we fix
      # the broken one. (Added in v0.1.9 after macOS native-rebuild
      # failures cancelled Windows + Linux builds three releases running.)
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: "Bugzilla-AI-Triage-Setup-*.exe"
          - os: macos-latest
            artifact: "Bugzilla-AI-Triage-*.dmg"
          - os: ubuntu-latest
            artifact: "Bugzilla AI Triage-*.AppImage"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # better-sqlite3's postinstall runs `prebuild-install`, which by
      # default downloads the prebuild matching the running Node ABI
      # (Node 20 on this runner = NODE_MODULE_VERSION 115). At runtime
      # the desktop's Electron process needs the binary's ABI to match
      # Electron's NODE_MODULE_VERSION — Node 20's prebuild won't load
      # under Electron, producing ERR_DLOPEN_FAILED (the bug v0.1.22's
      # diag exposed on the user's Windows install).
      #
      # We pin Electron to ^38.0.0 (resolved: 38.8.6, V8 12.x) because:
      #   1. better-sqlite3@12.10.0 publishes electron-v38 prebuilds —
      #      prebuild-install can download them, no compile needed.
      #   2. Electron 42 + V8 13 broke better-sqlite3@12.10.0's C++
      #      (zero-arg `v8::External::Value()` removed); @electron/rebuild
      #      compilation against Electron 42 headers fails identically
      #      on every OS. Electron 38's V8 12 still has the old API.
      #
      # `npm_config_runtime=electron` + `npm_config_target` BEFORE
      # `npm ci` makes prebuild-install fetch the electron-v38 binary
      # for the runner's OS (auto-detected). electron-builder then
      # packages it as-is (`npmRebuild: false`).
      - name: Install dependencies (Electron-targeted prebuild)
        env:
          npm_config_runtime: electron
          npm_config_target: "38.8.6"
          npm_config_disturl: https://electronjs.org/headers
        run: npm ci

      # Stage the bge-small-en-v1.5 embedder ONNX + tokenizer into models/ so
      # electron-builder bundles it (electron-builder.json copies models/ →
      # resources/app/.next/standalone/models). WITHOUT this step the installer
      # ships an EMPTY models/ dir (just .gitkeep), the query embedder can't
      # load offline, and hybrid retrieval silently degrades to BM25. The
      # download (~33 MB) is offline-loaded at runtime so the desktop never
      # needs network for embeddings. (onnxruntime-node's napi-v6 prebuild is
      # ABI-stable, so the Electron-targeted npm ci above doesn't affect it —
      # only better-sqlite3 needs the electron prebuild.)
      #
      # NOTE: the cross-encoder reranker (Phase A / v0.5.5) is intentionally
      # NOT staged here — it ships DORMANT (CORPUS_RERANK=1 to enable) because
      # the eval showed it regresses hit-rank (EVAL-v0.5.5-reranker-findings.md).
      # The v0.5.5 hit-rank win is test-spec demotion (code-only, no model). To
      # re-enable the reranker later, switch this step to `npm run fetch:models`.
      - name: Stage embedding model (bge-small-en-v1.5)
        # The fetch scripts default to the hf-mirror.com mirror (so China Docker
        # builds work without config). Pin the CI installer build back to the
        # canonical huggingface.co — it's fast + proven from GitHub's runners,
        # and keeps the released artifact off a third-party mirror.
        env:
          HF_ENDPOINT: https://huggingface.co
        run: npm run fetch:model

      # Per-OS build target. `dist:win` etc. each chain `next build` first,
      # which writes .next/standalone — the payload electron-builder packs
      # into resources/app via extraResources (see electron-builder.json).
      - name: Build Windows installer
        if: matrix.os == 'windows-latest'
        run: npm run dist:win

      - name: Build macOS DMG
        if: matrix.os == 'macos-latest'
        run: npm run dist:mac

      - name: Build Linux AppImage
        if: matrix.os == 'ubuntu-latest'
        run: npm run dist:linux

      # Tag pushes go straight to the GitHub Release; the workflow-artifact
      # storage is irrelevant for shipping (and got us bitten on v0.1.10 +
      # v0.1.11 when org-level Actions artifact quota was full and the
      # upload-artifact step failed the whole job before this step ran).
      # softprops/action-gh-release uploads directly to the Release REST API
      # so it sidesteps the workflow-artifact quota entirely.
      - name: Attach to release
        if: always() && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact }}
          draft: true       # human reviews / writes notes before publishing
          generate_release_notes: true

      # Save the installer as a workflow artifact ONLY for workflow_dispatch
      # dry-runs (where there's no tag and no release to attach to). On tag
      # pushes this would be a duplicate of what's already on the Release,
      # and it's the step that hits the Actions storage-quota cap.
      - name: Upload installer (dispatch dry-run only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
