name: Release installer

# Builds the Windows .exe (and macOS .dmg + Linux .AppImage) installers
# on every git tag matching v*.*.* and attaches them to a GitHub Release.
#
# This is the canonical way to produce the Windows installer — building
# a real signed .exe from macOS via Wine is flaky and we'd rather lean on
# a clean Windows runner. To cut a release:
#   git tag v0.2.0 && git push --tags

on:
  push:
    tags:
      - "v*.*.*"
  # Manual trigger from the Actions tab — useful for dry-running the
  # build without cutting an actual tag/release.
  workflow_dispatch:

permissions:
  contents: write   # so the publish step can create / attach to a release

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: "Bugzilla-AI-Triage-Setup-*.exe"
          - os: macos-latest
            artifact: "Bugzilla-AI-Triage-*.dmg"
          - os: ubuntu-latest
            artifact: "Bugzilla AI Triage-*.AppImage"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Per-OS build target. `dist:win` etc. each chain `next build` first,
      # which writes .next/standalone — the payload electron-builder packs
      # into resources/app via extraResources (see electron-builder.json).
      - name: Build Windows installer
        if: matrix.os == 'windows-latest'
        run: npm run dist:win

      - name: Build macOS DMG
        if: matrix.os == 'macos-latest'
        run: npm run dist:mac

      - name: Build Linux AppImage
        if: matrix.os == 'ubuntu-latest'
        run: npm run dist:linux

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

      # Only attach to a GitHub Release for tag pushes — workflow_dispatch
      # runs leave the artifacts on the workflow run page only.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact }}
          draft: true       # human reviews / writes notes before publishing
          generate_release_notes: true
